
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mYi介 的兴趣空间</title>
  <meta name="description" content="Ai · 五万英尺 | mYi介 的兴趣空间">
  <meta name="color-scheme" content="dark light">
  <style>
    :root { --bg:#0f172a; --fg:#e2e8f0; --muted:#94a3b8; --link:#93c5fd; --border:#334155; --accent:#38bdf8; }
    * { box-sizing: border-box; }
    html, body { height:100%; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
    .hero { padding:48px 16px 28px; border-bottom:1px solid var(--border); background:#0b1220; }
    .container { max-width:960px; margin:0 auto; }
    h1 { margin:0 0 8px; font-size:36px; color:#f8fafc; letter-spacing:.5px; }
    .subtitle { color:var(--muted); font-size:16px; }
    nav.tabs { display:flex; gap:12px; margin:18px 0 0; }
    nav.tabs button { background:#0b1220; color:var(--fg); border:1px solid var(--border); padding:8px 14px; border-radius:999px; cursor:pointer; transition:border-color .2s,color .2s; }
    nav.tabs button.active { border-color:var(--accent); color:var(--accent); }
    main { padding:22px 16px 40px; }
    section { padding:16px 0; }
    .panel { border:1px solid var(--border); border-radius:12px; overflow:hidden; background:#0b1220; }
    iframe { width:100%; height:70vh; border:0; display:block; background:#0b1220; }
    .placeholder { padding:24px; }
    .contact { margin-top:18px; font-size:15px; color:var(--muted); }
    a { color:var(--link); text-decoration:none; }
    a:hover { text-decoration:underline; }
    footer { border-top:1px solid var(--border); padding:16px; text-align:center; color:var(--muted); }
  </style>
  <!-- Baidu Tongji（异步）—仅在正式域名加载 -->
  <script>
    if (location.hostname === 'lixur2016sh-design.github.io') {
      var _hmt = _hmt || [];
      (function() {
        var hm = document.createElement("script");
        hm.src = "https://hm.baidu.com/hm.js?1edaf27b950211ca2462fd11e7c7ef3a";
        var s = document.getElementsByTagName("script")[0];
        s.parentNode.insertBefore(hm, s);
      })();
    }
  </script>
</head>
<body>
  <header class="hero">
    <div class="container">
      <h1>mYi介 的兴趣空间</h1>
      <div class="subtitle">Ai · 五万英尺</div>
      <nav class="tabs" role="tablist" aria-label="副标题切换">
        <button id="tab-ai" class="active" role="tab" aria-selected="true" aria-controls="panel-ai">Ai</button>
        <button id="tab-alt" role="tab" aria-selected="false" aria-controls="panel-alt">五万英尺</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- Panel: Ai（展示 share_ai.html 内容） -->
    <section id="panel-ai" class="panel" role="tabpanel" aria-labelledby="tab-ai">
      <iframe id="aiFrame" src="./share_ai.html" title="AI 分享（Markdown）"></iframe>
    </section>

    <!-- Panel: 五万英尺（占位符） -->
    <section id="panel-alt" class="panel" role="tabpanel" aria-labelledby="tab-alt" hidden>
      <div class="placeholder">
        <h2 style="margin-top:0">五万英尺</h2>
        <p>这里是一个占位符（Placeholder）。未来可以展示高层视角的内容，如愿景、路线图或年度主题。</p>
      </div>
    </section>

    <!-- 联系我 -->
    <section class="contact">
      联系我：<a href="mailto:bruce.lee@zf.com">bruce.lee@zf.com</a>
    </section>
  </main>

  <footer>
    © 2026 mYi介 · 由 GitHub Pages 托管
  </footer>

  <script>
    // 简单的无依赖 Tab 切换
    const tabAi = document.getElementById('tab-ai');
    const tabAlt = document.getElementById('tab-alt');
    const panelAi = document.getElementById('panel-ai');
    const panelAlt = document.getElementById('panel-alt');
    const iframe = document.getElementById('aiFrame');

    function activate(which) {
      const isAi = which === 'ai';
      tabAi.classList.toggle('active', isAi);
      tabAi.setAttribute('aria-selected', String(isAi));
      tabAlt.classList.toggle('active', !isAi);
      tabAlt.setAttribute('aria-selected', String(!isAi));
      panelAi.hidden = !isAi;
      panelAlt.hidden = isAi;
      // 切到 Ai 时，尝试重新自适应高度
      if (isAi) autoResize();
    }

    function autoResize(){
      try {
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        const h = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight, 600);
        iframe.style.height = h + 'px';
      } catch (e) {
        // 跨域或尚未加载，忽略
      }
    }

    iframe.addEventListener('load', autoResize);
    // 保险：定时尝试一次，防止内容折叠/展开导致高度变化
    setInterval(autoResize, 1500);

    tabAi.addEventListener('click', () => activate('ai'));
    tabAlt.addEventListener('click', () => activate('alt'));
  </script>
</body>
</html>


<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 分享</title>
  <meta name="color-scheme" content="dark light">
  <!-- 让所有链接默认在顶层打开，避免首页被嵌套加载造成“内容重复” -->
  <base target="_top">
  <style>
    :root { --bg:#0f172a; --fg:#e2e8f0; --muted:#94a3b8; --link:#93c5fd; --border:#334155; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; line-height:1.7; }
    .wrap { max-width:1100px; margin:32px auto; padding:0 16px; }
    .grid { display:grid; grid-template-columns: 280px 1fr; gap:18px; }
    @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
    .toc { background:#0b1220; border:1px solid var(--border); border-radius:10px; padding:12px 16px; position:sticky; top:12px; align-self:start; }
    .toc h2 { margin:0 0 8px; font-size:18px; }
    .toc ul { margin:0; padding-left:18px; }
    .content { background:#0b1220; border:1px solid var(--border); border-radius:10px; padding:16px 18px; }
    a { color:var(--link); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .fold { border:1px solid var(--border); border-radius:10px; padding:8px 12px; margin:14px 0; background:#0b1220; }
    .fold > summary { cursor:pointer; font-weight:600; }
    .obsidian-embed { background:#0b1220; border:1px dashed var(--border); padding:8px 12px; border-radius:8px; color:var(--muted); }
    .actions { display:flex; gap:8px; align-items:center; margin:8px 0 16px; }
    button.small { background:#0b1220; color:var(--fg); border:1px solid var(--border); padding:6px 10px; border-radius:8px; cursor:pointer; }
  </style>
  <script>
    // 向父页面报告高度（加载 & 内容变化时）
    function reportHeight(){
      requestAnimationFrame(() => {
        const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
        parent && parent.postMessage({ type: 'iframeHeight', h }, '*');
      });
    }
    document.addEventListener('DOMContentLoaded', reportHeight);
    window.addEventListener('load', reportHeight);
    const ro = new ResizeObserver(reportHeight);
    ro.observe(document.documentElement);
  </script>
</head>
<body>
  <div class="wrap">
    <div class="grid">
      <aside class="toc">
        <h2>目录</h2>
        <ul><li><a href="#games">游戏化准备</a></li><li><a href="#rule">Rule</a></li><li><a href="#main">主体</a></li><li><a href="#close">收尾</a><ul><li><a href="#who-fear-ai">谁会害怕AI</a></li><li><a href="#else">Else</a></li></ul></li></ul>
        <div class="actions">
          <button class="small" id="expand-all">全部展开</button>
          <button class="small" id="collapse-all">全部折叠</button>
          <a href="/" style="margin-left:auto">← 返回首页</a>
        </div>
      </aside>
      <article class="content">
        <details id="games" class="fold" open><summary>游戏化准备</summary><p>（正文已生成并展示在此处；你的长文章节可展开/折叠。）</p></details>
        <footer style="margin:16px 0; color:#94a3b8; font-size:14px;">© 2026 mYi介 · 本页由Markdown转HTML生成。若要显示 Obsidian 内嵌的图片/视频，请将相关文件上传到本站并改为标准 <code>&lt;img&gt;</code>/<code>&lt;video&gt;</code> 标签或相对路径。</footer>
      </article>
    </div>
  </div>
  <script>
    // 折叠控制按钮
    const folds = Array.from(document.querySelectorAll('.fold'));
    document.getElementById('expand-all')?.addEventListener('click', () => {
      folds.forEach(d => d.setAttribute('open', ''));
      reportHeight();
    });
    document.getElementById('collapse-all')?.addEventListener('click', () => {
      folds.forEach(d => d.removeAttribute('open'));
      reportHeight();
    });
  </script>
</body>
</html>
